name: Build macOS

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64
    # Needs a macOS 14 SDK or newer: SCScreenshotManager and SMAppService both
    # land in 14.
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        run: brew install qt ninja

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          FOMOSNAP_CODESIGN_IDENTITY: ${{ vars.FOMOSNAP_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64" || {
            echo "APPLE_CERTIFICATE_P12_BASE64 is not configured" >&2
            exit 1
          }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || {
            echo "APPLE_CERTIFICATE_PASSWORD is not configured" >&2
            exit 1
          }
          test -n "$FOMOSNAP_CODESIGN_IDENTITY" || {
            echo "FOMOSNAP_CODESIGN_IDENTITY repository variable is not configured" >&2
            exit 1
          }

          keychain="$RUNNER_TEMP/fomosnap-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/fomosnap-developer-id.p12"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

          echo "FOMOSNAP_CODESIGN_IDENTITY=$FOMOSNAP_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "FOMOSNAP_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Build, run the smoke suite, and analyze sources
        run: make check

      - name: Stage the application bundle
        run: cmake --install build --prefix "$PWD/stage"

      - name: Sign release application
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FOMOSNAP_CODESIGN_IDENTITY: ${{ vars.FOMOSNAP_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --deep \
            --options runtime \
            --timestamp \
            --sign "$FOMOSNAP_CODESIGN_IDENTITY" \
            stage/FOMOsnap.app
          codesign --verify --deep --strict --verbose=2 stage/FOMOsnap.app

      - name: Notarize and staple release application
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8_BASE64" || {
            echo "APPLE_API_KEY_P8_BASE64 is not configured" >&2
            exit 1
          }
          test -n "$APPLE_API_KEY_ID" || {
            echo "APPLE_API_KEY_ID is not configured" >&2
            exit 1
          }
          test -n "$APPLE_API_ISSUER_ID" || {
            echo "APPLE_API_ISSUER_ID is not configured" >&2
            exit 1
          }

          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          notarization_zip="$RUNNER_TEMP/FOMOsnap-notarization.zip"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$api_key"
          ditto -c -k --keepParent stage/FOMOsnap.app "$notarization_zip"
          xcrun notarytool submit "$notarization_zip" \
            --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple stage/FOMOsnap.app
          xcrun stapler validate stage/FOMOsnap.app
          spctl --assess --type execute --verbose=4 stage/FOMOsnap.app

      - name: Package the macOS artifact
        run: |
          version="$(./build/FOMOsnap.app/Contents/MacOS/FOMOsnap --version | cut -d' ' -f2)"
          archive="fomosnap-${version}-macos-arm64.tar.gz"
          echo "CAPTURE_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "CAPTURE_ARTIFACT=${archive%.tar.gz}" >> "$GITHUB_ENV"
          cat > stage/fomosnap <<'SH'
          #!/bin/bash
          exec "/Applications/FOMOsnap.app/Contents/MacOS/FOMOsnap" "$@"
          SH
          chmod 0755 stage/fomosnap
          tar -C stage -czf "$archive" FOMOsnap.app fomosnap

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAPTURE_ARTIFACT }}
          path: ${{ env.CAPTURE_ARCHIVE }}
          if-no-files-found: error

      - name: Attach artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CAPTURE_ARCHIVE }}

      - name: Remove temporary signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "${FOMOSNAP_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$FOMOSNAP_KEYCHAIN_PATH" || true
          fi
